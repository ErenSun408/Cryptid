<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self';">
  <title>WebView2 session integration</title>
</head>
<body>
  <main id="session-surface" data-session-state="initializing">
    <label for="session-password">密码</label>
    <input id="session-password" type="password" disabled>
    <button id="session-action" type="button" disabled>正在初始化</button>
    <output id="session-status">正在连接安全组件</output>
  </main>
  <script src="session.js"></script>
  <script src="webview_typed_array_integration.js"></script>
</body>
</html>
