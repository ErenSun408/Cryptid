<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self';">
  <title>Card product WebView integration</title>
</head>
<body>
  <main id="card-session-surface" data-session-state="initializing"
        data-busy="true">
    <p id="card-state-title">正在连接安全组件</p>
    <section id="password-fields" hidden>
      <label id="card-password-label" for="card-password">密码</label>
      <input id="card-password" type="password" disabled>
      <button id="card-password-visibility" type="button"
              aria-label="显示密码" aria-controls="card-password"
              aria-pressed="false" disabled>显示</button>
      <div id="confirmation-field" hidden>
        <label for="card-password-confirmation">确认密码</label>
        <input id="card-password-confirmation" type="password" disabled>
        <button id="card-password-confirmation-visibility" type="button"
                aria-label="显示确认密码"
                aria-controls="card-password-confirmation"
                aria-pressed="false" disabled>显示</button>
      </div>
      <div class="strength-slot">
        <output id="password-strength" data-level="" data-score="0" hidden>
          <span>密码强度</span>
          <span class="password-strength-segment"></span>
          <span class="password-strength-segment"></span>
          <span class="password-strength-segment"></span>
          <span id="password-strength-description"></span>
        </output>
      </div>
    </section>
    <button id="card-session-action" type="button" disabled hidden>
      <span id="card-session-spinner" hidden></span>
      <span id="card-session-action-label">正在初始化</span>
    </button>
    <output id="card-session-status">正在连接安全组件</output>
    <output id="card-session-error" hidden></output>
  </main>
  <section id="authenticated-dashboard" hidden>
    <button id="dashboard-unmount" type="button" hidden>安全卸载</button>
    <span id="dashboard-volume-state">未挂载</span>
    <span id="dashboard-container-count">0</span>
    <output id="dashboard-status" data-tone=""></output>
    <nav>
      <button class="dashboard-nav active" type="button"
              data-section="dashboard" aria-current="page">仪表盘</button>
      <button class="dashboard-nav" type="button"
              data-section="containers">容器<span
              id="nav-container-count">0</span></button>
      <div role="link" aria-disabled="true" title="正在开发中"
           data-tooltip="正在开发中">文件管理</div>
      <div role="link" aria-disabled="true" title="正在开发中"
           data-tooltip="正在开发中">备份中心</div>
      <button class="dashboard-nav" type="button"
              data-section="history">操作日志</button>
      <button class="dashboard-nav" type="button"
              data-section="settings">系统设置</button>
    </nav>
    <section id="dashboard-section-dashboard" class="dashboard-section active">
      <button type="button" data-create-container>新建容器</button>
      <button type="button" data-mount-existing>导入</button>
      <div class="container-list" data-container-list></div>
    </section>
    <section id="dashboard-section-containers" class="dashboard-section">
      <button type="button" data-create-container>新建容器</button>
      <button type="button" data-mount-existing>导入容器</button>
      <div class="container-list" data-container-list></div>
    </section>
    <section id="dashboard-section-history" class="dashboard-section">
      <button id="operation-history-clear" type="button">清空日志</button>
      <table><tbody id="operation-history-body"></tbody></table>
    </section>
    <section id="dashboard-section-settings" class="dashboard-section">
      <button type="button" role="switch" aria-checked="false"
              data-setting="auto-mount">登录后自动挂载全部容器</button>
      <button id="reset-card-open" type="button">重新初始化安全卡</button>
      <span id="reset-card-blocked" hidden></span>
      <button type="button" role="switch" aria-checked="true"
              data-setting="remember-containers">记住容器位置</button>
      <button type="button" role="switch" aria-checked="false"
              data-setting="mount-imported">自动尝试挂载导入的容器</button>
      <span role="switch" aria-checked="true" aria-disabled="true"
            >拔出安全卡时立即卸载全部卷</span>
    </section>
  </section>
  <div id="reset-card-dialog" role="dialog" hidden>
    <button id="reset-card-close" type="button">关闭</button>
    <input id="reset-card-acknowledge" type="checkbox">
    <output id="reset-card-status"></output>
    <button id="reset-card-cancel" type="button">取消</button>
    <button id="reset-card-confirm" type="button" disabled>重新初始化</button>
  </div>
  <div id="forget-container-dialog" role="dialog" hidden>
    <h3 id="forget-container-title">从列表移除</h3>
    <button id="forget-container-close" type="button">关闭</button>
    <p>将 <strong id="forget-container-name"></strong> 从列表中移除。</p>
    <output id="forget-container-status"></output>
    <button id="forget-container-cancel" type="button">取消</button>
    <button id="forget-container-confirm" type="button">移除</button>
  </div>
  <div id="create-volume-dialog" role="dialog" data-step="type" hidden>
    <h3 id="create-volume-title">新建容器</h3>
    <p id="create-volume-description"></p>
    <div id="create-type-note"></div>
    <button id="create-volume-close" type="button">关闭</button>
    <div id="create-type-step" role="radiogroup">
      <button type="button" role="radio" aria-checked="true"
              data-create-kind="encrypted">标准容器</button>
      <button type="button" role="radio" aria-checked="false"
              data-create-kind="hidden">含隐藏卷的容器</button>
    </div>
    <div id="create-container-form" hidden>
      <label for="create-container-name">名称</label>
      <input id="create-container-name" type="text" maxlength="96">
      <p id="create-container-name-error" hidden></p>
      <label for="create-container-directory">路径</label>
      <input id="create-container-directory" type="text">
      <button id="create-container-browse" type="button">浏览</button>
      <p id="create-container-directory-error" hidden></p>
      <label for="create-container-capacity">容量</label>
      <input id="create-container-capacity" type="number" min="20"
             max="1048576" step="1" value="64">
      <div>
        <button id="create-container-unit" type="button" data-unit="mib"
                aria-haspopup="listbox" aria-expanded="false">
          <span class="unit-name">MiB</span>
        </button>
        <div class="unit-list" role="listbox" hidden>
          <button class="unit-option" type="button" role="option"
                  aria-selected="true" data-unit="mib">MiB</button>
          <button class="unit-option" type="button" role="option"
                  aria-selected="false" data-unit="gib">GiB</button>
          <button class="unit-option" type="button" role="option"
                  aria-selected="false" data-unit="tib">TiB</button>
        </div>
      </div>
      <p id="create-container-error" hidden></p>
    </div>
    <div id="create-container-b-form" hidden>
      <label for="create-container-b-name">名称</label>
      <input id="create-container-b-name" type="text" maxlength="96">
      <p id="create-container-b-name-error" hidden></p>
      <label for="create-container-b-directory">路径</label>
      <input id="create-container-b-directory" type="text">
      <button id="create-container-b-browse" type="button">浏览</button>
      <p id="create-container-b-directory-error" hidden></p>
      <input id="create-container-b-capacity" type="number" min="20"
             max="1048576" step="1" value="128">
      <div>
        <button id="create-container-b-unit" type="button" data-unit="mib"
                aria-haspopup="listbox" aria-expanded="false">
          <span class="unit-name">MiB</span>
        </button>
        <div class="unit-list" role="listbox" hidden>
          <button class="unit-option" type="button" role="option"
                  aria-selected="true" data-unit="mib">MiB</button>
          <button class="unit-option" type="button" role="option"
                  aria-selected="false" data-unit="gib">GiB</button>
          <button class="unit-option" type="button" role="option"
                  aria-selected="false" data-unit="tib">TiB</button>
        </div>
      </div>
      <input id="create-container-b-hidden-capacity" type="number" min="1"
             max="1048575" step="1" value="96">
      <span id="create-container-b-unit-echo">MiB</span>
      <p id="create-container-b-error" hidden></p>
      <input id="create-container-b-second" type="password">
      <input id="create-container-b-second-confirmation" type="password">
      <input id="create-container-b-acknowledge" type="checkbox">
    </div>
    <output id="create-volume-status"></output>
    <button id="create-volume-cancel" type="button">
      <svg id="create-volume-back-icon" viewBox="0 0 24 24" hidden></svg>
      <span id="create-volume-cancel-label">取消</span>
    </button>
    <button id="create-volume-continue" type="button">下一步</button>
  </div>
  <script src="card_session.js?v=p2-17g-card-reset"></script>
  <script src="card_product_webview_integration.js?v=p2-17g-card-reset"></script>
</body>
</html>
