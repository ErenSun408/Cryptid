<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self';">
  <title>Card product WebView integration</title>
</head>
<body>
  <main id="card-session-surface" data-session-state="initializing"
        data-busy="true">
    <p id="card-state-title">正在连接安全组件</p>
    <section id="password-fields" hidden>
      <label id="card-password-label" for="card-password">密码</label>
      <input id="card-password" type="password" disabled>
      <button id="card-password-visibility" type="button"
              aria-label="显示密码" aria-controls="card-password"
              aria-pressed="false" disabled>显示</button>
      <div id="confirmation-field" hidden>
        <label for="card-password-confirmation">确认密码</label>
        <input id="card-password-confirmation" type="password" disabled>
        <button id="card-password-confirmation-visibility" type="button"
                aria-label="显示确认密码"
                aria-controls="card-password-confirmation"
                aria-pressed="false" disabled>显示</button>
      </div>
      <div class="strength-slot">
        <output id="password-strength" data-level="" data-score="0" hidden>
          <span>密码强度</span>
          <span class="password-strength-segment"></span>
          <span class="password-strength-segment"></span>
          <span class="password-strength-segment"></span>
          <span id="password-strength-description"></span>
        </output>
      </div>
    </section>
    <button id="card-session-action" type="button" disabled hidden>
      正在初始化
    </button>
    <output id="card-session-status">正在连接安全组件</output>
    <output id="card-session-error" hidden></output>
  </main>
  <section id="authenticated-dashboard" hidden>
    <button id="dashboard-unmount" type="button" hidden>安全卸载</button>
    <span id="dashboard-volume-state">未挂载</span>
    <nav>
      <button class="dashboard-nav active" type="button"
              data-section="dashboard" aria-current="page">仪表盘</button>
      <button class="dashboard-nav" type="button"
              data-section="encrypted">加密盘管理</button>
      <button class="dashboard-nav" type="button"
              data-section="hidden">隐藏盘管理</button>
      <div role="link" aria-disabled="true" title="正在开发中"
           data-tooltip="正在开发中">文件管理</div>
      <div role="link" aria-disabled="true" title="正在开发中"
           data-tooltip="正在开发中">备份中心</div>
      <div role="link" aria-disabled="true" title="正在开发中"
           data-tooltip="正在开发中">操作历史</div>
      <div role="link" aria-disabled="true" title="正在开发中"
           data-tooltip="正在开发中">系统设置</div>
    </nav>
    <section id="dashboard-section-dashboard" class="dashboard-section active">
      <button type="button" data-create-kind="encrypted">新建</button>
      <button type="button" data-create-kind="hidden">新建</button>
    </section>
    <section id="dashboard-section-encrypted" class="dashboard-section">
      <button type="button" data-create-kind="encrypted">新建加密盘</button>
    </section>
    <section id="dashboard-section-hidden" class="dashboard-section">
      <button type="button" data-create-kind="hidden">新建隐藏盘</button>
    </section>
  </section>
  <div id="create-volume-dialog" role="dialog" hidden>
    <h3 id="create-volume-title">新建加密盘</h3>
    <p id="create-volume-description"></p>
    <button id="create-volume-close" type="button">关闭</button>
    <div id="create-container-a-form" hidden>
      <label for="create-container-a-capacity">加密盘容量</label>
      <input id="create-container-a-capacity" type="number" min="20"
             max="1048576" step="1" value="64">
    </div>
    <output id="create-volume-status"></output>
    <button id="create-volume-cancel" type="button">返回</button>
    <button id="create-volume-continue" type="button">创建加密盘</button>
  </div>
  <script src="card_session.js?v=p2-16c-container-a-ui"></script>
  <script src="card_product_webview_integration.js?v=p2-16c-container-a-ui"></script>
</body>
</html>
