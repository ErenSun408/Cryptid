<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'unsafe-inline';">
  <title>WebView2 typed array integration</title>
</head>
<body>
  <script>
    (async () => {
      const bytes = new Uint8Array([0x70, 0x00, 0xC3, 0xA4]);
      let completed = false;
      try {
        chrome.webview.hostObjects.options.shouldPassTypedArraysAsArrays = true;
        await chrome.webview.hostObjects.nativeBridge.submitPasswordBytes(bytes);
        await chrome.webview.hostObjects.nativeBridge.unmount();
        completed = true;
      } catch (_) {
        completed = false;
      } finally {
        bytes.fill(0);
        const wiped = bytes.every((value) => value === 0);
        chrome.webview.postMessage(completed && wiped ? "pass" : "fail");
      }
    })();
  </script>
</body>
</html>
