<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USB Vault · 全流程 UI 设计预览</title>
<style>
/* ============================================================
   USB Vault — 全流程 UI 设计预览
   设计语言：石墨底 + 香槟金点缀 + 发丝线分隔
   本文件是设计稿，不是实现代码；脚本仅用于切换屏幕。
   ============================================================ */
:root{
  --ink-900:#08090B;
  --ink-850:#0B0D10;
  --ink-800:#101216;
  --ink-750:#14171C;
  --ink-700:#191D23;
  --line:rgba(255,255,255,.07);
  --line-2:rgba(255,255,255,.12);
  --line-3:rgba(255,255,255,.18);
  --text:#E8EAED;
  --text-2:#98A1AC;
  --text-3:#6A727C;
  --gold:#C8A96A;
  --gold-2:#E0C48C;
  --ok:#68BE95;
  --warn:#D8A544;
  --danger:#D96B62;
  --info:#7FA6C8;
  --r-sm:6px; --r:10px; --r-lg:14px;
  --mono:"SFMono-Regular",Consolas,"Cascadia Mono",monospace;
  --sans:"Segoe UI Variable Text","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#121316; color:var(--text); font-family:var(--sans);
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased; overflow:hidden;
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2)}
::-webkit-scrollbar-track{background:transparent}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ===================== 预览外壳 ===================== */
.shell{display:grid;grid-template-columns:296px 1fr;height:100vh}
.index{border-right:1px solid var(--line);background:var(--ink-850);overflow-y:auto;padding:22px 0 40px}
.index-head{padding:6px 22px 18px}
.index-head .mark{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.index-head .glyph{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#12140f;background:linear-gradient(145deg,var(--gold-2),var(--gold))}
.index-head .glyph svg{width:15px;height:15px;stroke-width:1.8}
.index-head h1{font-size:12.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase}
.index-head p{font-size:12px;color:var(--text-3);line-height:1.7}
.index-head .rule{height:1px;background:var(--line);margin:16px 0 14px}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.grp-label{padding:18px 22px 8px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.nav-s{display:flex;align-items:center;gap:10px;width:100%;padding:8px 22px;background:none;border:0;color:var(--text-2);font:inherit;font-size:13px;text-align:left;cursor:pointer;position:relative}
.nav-s:hover{color:var(--text);background:rgba(255,255,255,.03)}
.nav-s.on{color:var(--text);background:rgba(200,169,106,.07)}
.nav-s.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;background:var(--gold)}
.nav-s .num{font-family:var(--mono);font-size:11px;color:var(--text-3);min-width:22px}
.nav-s.on .num{color:var(--gold)}
.nav-s .label{flex:1}
.nav-s .dot{width:5px;height:5px;border-radius:50%;flex:0 0 auto}
.dot-done{background:var(--ok)} .dot-part{background:var(--warn)} .dot-todo{background:var(--text-3)} .dot-spec{background:var(--info)}

.stage{display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(120% 80% at 50% -10%,#1B1E24 0%,#121316 55%)}
.stage-bar{display:flex;align-items:center;gap:16px;padding:14px 28px;border-bottom:1px solid var(--line);background:rgba(10,11,13,.5)}
.stage-bar h2{font-size:14.5px;font-weight:600}
.stage-bar .path{font-size:11.5px;color:var(--text-3);font-family:var(--mono)}
.stage-bar .sp{flex:1}
.pager{display:flex;gap:6px}
.pager button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:transparent;color:var(--text-2);cursor:pointer;display:grid;place-items:center}
.pager button:hover{color:var(--text);border-color:var(--line-3);background:rgba(255,255,255,.04)}
.pager button svg{width:15px;height:15px}
.stage-body{flex:1;overflow-y:auto;padding:34px 28px 60px}
.frame-wrap{display:flex;justify-content:center}
.frame-scale{transform-origin:top center}

/* 状态标记 */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.chip i{width:5px;height:5px;border-radius:50%;background:currentColor;display:block}
.chip.done{color:var(--ok);background:rgba(104,190,149,.1);border-color:rgba(104,190,149,.22)}
.chip.part{color:var(--warn);background:rgba(216,165,68,.1);border-color:rgba(216,165,68,.22)}
.chip.todo{color:var(--text-2);background:rgba(255,255,255,.05);border-color:var(--line-2)}
.chip.change{color:var(--info);background:rgba(127,166,200,.1);border-color:rgba(127,166,200,.24)}

/* 说明面板 */
.notes{margin:26px auto 0;max-width:1180px;display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
.note-card{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--ink-850);padding:20px 22px}
.note-card h3{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);font-weight:600;margin-bottom:12px}
.note-card ul{list-style:none;display:grid;gap:9px}
.note-card li{position:relative;padding-left:15px;font-size:13px;color:var(--text-2);line-height:1.65}
.note-card li::before{content:"";position:absolute;left:0;top:9px;width:4px;height:4px;border-radius:50%;background:var(--gold);opacity:.7}
.note-card li b{color:var(--text);font-weight:600}
.note-card li.warn::before{background:var(--danger);opacity:.9}
.refs{display:flex;flex-wrap:wrap;gap:6px}
.ref{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:6px;color:var(--text-2);background:rgba(255,255,255,.04);border:1px solid var(--line)}

/* ===================== 应用窗口 ===================== */
.win{border:1px solid var(--line-2);border-radius:12px;overflow:hidden;background:var(--ink-900);box-shadow:0 40px 90px -30px rgba(0,0,0,.9);display:flex;flex-direction:column;position:relative}
.titlebar{height:40px;flex:0 0 40px;display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 16px;border-bottom:1px solid var(--line);background:var(--ink-850)}
.tb-brand{display:flex;align-items:center;gap:9px}
.tb-brand .glyph{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:#12140f;background:linear-gradient(145deg,var(--gold-2),var(--gold))}
.tb-brand .glyph svg{width:11px;height:11px;stroke-width:2}
.tb-brand span{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-2);font-weight:600}
.tb-ctl{display:flex}
.tb-ctl i{width:38px;height:32px;display:grid;place-items:center;border-radius:6px;color:var(--text-3)}
.tb-ctl i svg{width:11px;height:11px;stroke-width:1.4}
.win-body{flex:1;min-height:0;display:flex}

/* 会话入口（小窗） */
.gate{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 46px;text-align:center;position:relative;background:radial-gradient(90% 60% at 50% 22%,rgba(200,169,106,.07) 0%,transparent 60%),var(--ink-900)}
.gate-mark{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;margin-bottom:20px;color:var(--gold);border:1px solid rgba(200,169,106,.3);background:rgba(200,169,106,.07)}
.gate-mark.muted{color:var(--text-3);border-color:var(--line-2);background:rgba(255,255,255,.03)}
.gate-mark.danger{color:var(--danger);border-color:rgba(217,107,98,.35);background:rgba(217,107,98,.08)}
.gate-mark svg{width:24px;height:24px;stroke-width:1.4}
.gate-word{font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--text-2);font-weight:600}
.gate-rule{width:26px;height:1px;background:var(--gold);opacity:.55;margin:14px 0 22px}
.gate h2{font-size:19px;font-weight:600;margin-bottom:7px}
.gate .sub{font-size:12.5px;color:var(--text-3);line-height:1.7;max-width:310px}
.gate-form{width:100%;margin-top:26px;text-align:left}
.gate-foot{position:absolute;left:0;right:0;bottom:22px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:11.5px;color:var(--text-3)}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(104,190,149,.15)}
.pulse.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(216,165,68,.15)}
.pulse.off{background:var(--text-3);box-shadow:none}
.pulse.danger{background:var(--danger);box-shadow:0 0 0 3px rgba(217,107,98,.15)}

/* 表单件 */
.field{margin-bottom:14px}
.field > label{display:block;font-size:12px;color:var(--text-2);margin-bottom:7px;font-weight:500}
.inp{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--ink-850);color:var(--text);font-size:13.5px}
.inp.focus{border-color:rgba(200,169,106,.55);box-shadow:0 0 0 3px rgba(200,169,106,.1)}
.inp.err{border-color:rgba(217,107,98,.6);box-shadow:0 0 0 3px rgba(217,107,98,.1)}
.inp .val{flex:1;letter-spacing:.06em}
.inp .val.ph{color:var(--text-3);letter-spacing:0}
.inp .eye{color:var(--text-3)}
.inp .eye svg{width:16px;height:16px}
.inp .unit{color:var(--text-3);font-size:12px}
.inp.mono .val{font-family:var(--mono);font-size:12.5px;letter-spacing:0}
.inp.sm{height:36px;font-size:12.5px}
.caret{display:inline-block;width:1px;height:15px;background:var(--gold);vertical-align:-3px;margin-left:1px}
.hint{font-size:11.5px;color:var(--text-3);margin-top:7px;line-height:1.6}
.hint.err{color:var(--danger)}
.meter{display:flex;align-items:center;gap:10px;margin-top:11px}
.meter .segs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;flex:1}
.meter .segs i{height:3px;border-radius:99px;background:rgba(255,255,255,.1);display:block}
.meter .txt{font-size:11.5px;color:var(--text-3);min-width:56px;text-align:right}
.meter.lv1 .segs i:nth-child(1){background:var(--danger)}
.meter.lv2 .segs i:nth-child(-n+2){background:var(--warn)}
.meter.lv3 .segs i{background:var(--ok)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:var(--r);border:1px solid var(--line-2);background:rgba(255,255,255,.03);color:var(--text);font-size:13px;font-weight:600;cursor:default;white-space:nowrap}
.btn svg{width:15px;height:15px}
.btn.pri{border-color:transparent;color:#14160F;background:linear-gradient(145deg,var(--gold-2),var(--gold));box-shadow:0 6px 18px -8px rgba(200,169,106,.6)}
.btn.danger{border-color:rgba(217,107,98,.35);color:#F0A79F;background:rgba(217,107,98,.1)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.block{width:100%}
.btn.sm{height:32px;padding:0 12px;font-size:12px;border-radius:8px}
.btn.dis{opacity:.38}
.spin{width:14px;height:14px;border-radius:50%;border:1.6px solid rgba(20,22,15,.3);border-top-color:#14160F;display:block;animation:sp .8s linear infinite}
.spin.dark{border:1.6px solid rgba(255,255,255,.16);border-top-color:var(--gold)}
@keyframes sp{to{transform:rotate(360deg)}}
.tog{width:34px;height:19px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;flex:0 0 auto}
.tog i{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--text-2);display:block}
.tog.on{background:rgba(200,169,106,.35)}
.tog.on i{left:17px;background:var(--gold-2)}
.tog.lock{opacity:.55}
.cbx{width:16px;height:16px;border-radius:5px;border:1px solid var(--line-3);flex:0 0 auto;display:grid;place-items:center;color:transparent}
.cbx.on{background:var(--gold);border-color:var(--gold);color:#14160F}
.cbx svg{width:10px;height:10px;stroke-width:2.6}

/* ===================== 应用主界面 ===================== */
.side{width:216px;flex:0 0 216px;border-right:1px solid var(--line);background:var(--ink-850);padding:16px 12px;display:flex;flex-direction:column}
.side-lab{padding:14px 12px 6px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.side-lab:first-child{padding-top:4px}
.side-i{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--text-2);font-size:13px;position:relative}
.side-i svg{width:16px;height:16px;flex:0 0 auto}
.side-i.on{color:var(--text);background:rgba(255,255,255,.05)}
.side-i.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:2px;border-radius:0 2px 2px 0;background:var(--gold)}
.side-i .tail{margin-left:auto;font-size:11px;color:var(--text-3);font-family:var(--mono)}
.side-foot{margin-top:auto;padding:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px}
.side-foot .dotc{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.side-foot .t{font-size:11.5px;color:var(--text-2);line-height:1.4}
.side-foot .t small{display:block;color:var(--text-3);font-size:10.5px;font-family:var(--mono)}

.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--ink-900)}
.main-head{padding:26px 32px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.main-head h2{font-size:20px;font-weight:600;letter-spacing:-.01em}
.main-head p{font-size:12.5px;color:var(--text-3);margin-top:4px}
.main-head .acts{display:flex;gap:8px;align-items:center}
.main-body{flex:1;min-height:0;overflow:hidden;padding:22px 32px 28px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.tile{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--ink-850);padding:16px 18px}
.tile .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.tile .v{font-size:19px;font-weight:600;margin-top:8px;display:flex;align-items:center;gap:9px}
.tile .v small{font-size:12px;font-weight:500;color:var(--text-3)}
.tile .s{font-size:11.5px;color:var(--text-3);margin-top:3px}
.tile .v .ic{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;color:var(--gold);background:rgba(200,169,106,.12)}
.tile .v .ic svg{width:13px;height:13px}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.sec-title h3{font-size:13px;font-weight:600}
.sec-title .m{font-size:11.5px;color:var(--text-3)}

.list{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--ink-850)}
.row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;color:var(--text-2);background:rgba(255,255,255,.04);border:1px solid var(--line)}
.row .ic svg{width:16px;height:16px}
.row .ic.on{color:var(--gold);background:rgba(200,169,106,.1);border-color:rgba(200,169,106,.22)}
.row .ic.bad{color:var(--danger);background:rgba(217,107,98,.08);border-color:rgba(217,107,98,.24)}
.row .nm{min-width:0;flex:1}
.row .nm .t{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.row .nm .p{font-size:11.5px;color:var(--text-3);font-family:var(--mono);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .facts{display:flex;gap:22px;flex:0 0 auto;margin-right:6px}
.fact{min-width:64px}
.fact .fk{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);font-weight:600}
.fact .fv{font-size:12.5px;margin-top:2px;font-family:var(--mono)}
.row .ops{display:flex;gap:6px;flex:0 0 auto}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:5px;border:1px solid var(--line-2);color:var(--text-2);background:rgba(255,255,255,.04)}
.tag.gold{color:var(--gold);border-color:rgba(200,169,106,.28);background:rgba(200,169,106,.1)}
.tag.ok{color:var(--ok);border-color:rgba(104,190,149,.26);background:rgba(104,190,149,.09)}
.tag.bad{color:var(--danger);border-color:rgba(217,107,98,.3);background:rgba(217,107,98,.09)}

.note{display:flex;gap:11px;padding:13px 16px;border-radius:var(--r);border:1px solid var(--line);background:rgba(255,255,255,.02);font-size:12.5px;color:var(--text-2);line-height:1.65}
.note .ni{flex:0 0 auto;color:var(--text-3);margin-top:1px}
.note .ni svg{width:15px;height:15px}
.note.warn{border-color:rgba(216,165,68,.28);background:rgba(216,165,68,.06)}
.note.warn .ni{color:var(--warn)}
.note.danger{border-color:rgba(217,107,98,.3);background:rgba(217,107,98,.07)}
.note.danger .ni{color:var(--danger)}
.note.gold{border-color:rgba(200,169,106,.26);background:rgba(200,169,106,.06)}
.note.gold .ni{color:var(--gold)}
.note b{color:var(--text);font-weight:600}

.empty{border:1px dashed var(--line-2);border-radius:var(--r-lg);padding:46px 40px;text-align:center;background:rgba(255,255,255,.015)}
.empty .ic{width:46px;height:46px;border-radius:14px;margin:0 auto 16px;display:grid;place-items:center;color:var(--gold);border:1px solid rgba(200,169,106,.26);background:rgba(200,169,106,.07)}
.empty .ic svg{width:21px;height:21px;stroke-width:1.4}
.empty h4{font-size:15px;font-weight:600;margin-bottom:6px}
.empty p{font-size:12.5px;color:var(--text-3);max-width:420px;margin:0 auto 20px;line-height:1.75}

/* 模态 */
.scrim{position:absolute;inset:0;background:rgba(4,5,7,.66);display:grid;place-items:center;padding:28px}
.dlg{width:520px;max-width:100%;border:1px solid var(--line-2);border-radius:var(--r-lg);background:var(--ink-800);box-shadow:0 30px 70px -20px rgba(0,0,0,.85);overflow:hidden}
.dlg.wide{width:640px}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.dlg-h h3{font-size:14.5px;font-weight:600}
.dlg-h .x{color:var(--text-3)}
.dlg-h .x svg{width:15px;height:15px}
.dlg-b{padding:22px}
.dlg-b > p.lead{font-size:12.5px;color:var(--text-2);line-height:1.7;margin-bottom:18px}
.dlg-f{display:flex;justify-content:flex-end;gap:9px;padding:16px 22px;border-top:1px solid var(--line);background:rgba(255,255,255,.015)}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{border:1px solid var(--line-2);border-radius:var(--r);padding:16px;background:rgba(255,255,255,.02)}
.pick.on{border-color:rgba(200,169,106,.5);background:rgba(200,169,106,.07)}
.pick .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--text-2);background:rgba(255,255,255,.05);margin-bottom:11px}
.pick.on .ic{color:var(--gold);background:rgba(200,169,106,.14)}
.pick .ic svg{width:15px;height:15px}
.pick h4{font-size:13px;font-weight:600;margin-bottom:5px}
.pick p{font-size:11.5px;color:var(--text-3);line-height:1.6}
.steps{display:grid;gap:2px}
.step{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:9px;font-size:12.5px;color:var(--text-3)}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-family:var(--mono);border:1px solid var(--line-2);flex:0 0 auto}
.step.done{color:var(--text-2)}
.step.done .n{color:var(--ok);border-color:rgba(104,190,149,.4);background:rgba(104,190,149,.1)}
.step.done .n svg{width:11px;height:11px;stroke-width:2.4}
.step.now{color:var(--text);background:rgba(200,169,106,.07)}
.step.now .n{color:var(--gold);border-color:rgba(200,169,106,.45)}
.step .tail{margin-left:auto;font-size:11px;font-family:var(--mono);color:var(--text-3)}
.bar{height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--gold-2))}
.bar.ok i{background:var(--ok)} .bar.warn i{background:var(--warn)} .bar.danger i{background:var(--danger)}

table.log{width:100%;border-collapse:collapse;font-size:12.5px}
table.log th{text-align:left;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);font-weight:600;padding:0 14px 10px}
table.log td{padding:11px 14px;border-top:1px solid var(--line);color:var(--text-2)}
table.log td.t{font-family:var(--mono);font-size:11.5px;color:var(--text-3);white-space:nowrap}
table.log td.o{font-family:var(--mono);font-size:11.5px}
table.log tr:hover td{background:rgba(255,255,255,.015)}

.set-grp{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--ink-850);overflow:hidden;margin-bottom:14px}
.set-grp > h4{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);font-weight:600;padding:14px 18px 10px}
.set-r{display:flex;align-items:center;gap:16px;padding:14px 18px;border-top:1px solid var(--line)}
.set-r .st{flex:1;min-width:0}
.set-r .st b{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
.set-r .st span{font-size:11.5px;color:var(--text-3);line-height:1.6}
.kv{display:flex;justify-content:space-between;gap:20px;padding:11px 18px;border-top:1px solid var(--line);font-size:12.5px}
.kv .k{color:var(--text-3)}
.kv .v{font-family:var(--mono);font-size:12px}

/* 设计语言页 */
.dl{padding:34px 38px;overflow:hidden}
.dl h3{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);font-weight:600;margin:0 0 14px}
.dl .grid2{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw div{width:76px}
.sw i{display:block;height:44px;border-radius:9px;border:1px solid var(--line);margin-bottom:6px}
.sw span{font-size:10.5px;color:var(--text-3);font-family:var(--mono)}
.tscale > div{border-bottom:1px solid var(--line);padding:9px 0;display:flex;align-items:baseline;gap:14px}
.tscale small{font-family:var(--mono);font-size:10.5px;color:var(--text-3);min-width:88px}
.flowmap{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:6px}
.fm{border:1px solid var(--line);border-radius:var(--r);background:var(--ink-850);padding:14px}
.fm h5{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:10px}
.fm ol{list-style:none;display:grid;gap:7px}
.fm li{font-size:11.5px;color:var(--text-2);display:flex;gap:8px}
.fm li em{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
</style>
</head>
<body>
<div class="shell">
  <aside class="index">
    <div class="index-head">
      <div class="mark">
        <span class="glyph"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.6-2.9 8.2-7 10-4.1-1.8-7-5.4-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></span>
        <h1>USB Vault</h1>
      </div>
      <p>全流程 UI 设计预览 · v3 稿<br>石墨 + 香槟金 · 面向 WebView2</p>
      <div class="rule"></div>
      <div class="legend">
        <span class="chip done"><i></i>已实现</span>
        <span class="chip part"><i></i>部分实现</span>
        <span class="chip todo"><i></i>未实现</span>
      </div>
    </div>
    <nav id="index-nav"></nav>
  </aside>
  <section class="stage">
    <header class="stage-bar">
      <h2 id="sTitle">—</h2>
      <span class="path" id="sPath"></span>
      <span class="sp"></span>
      <span id="sChip"></span>
      <div class="pager">
        <button id="prev" title="上一屏 (↑)"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button id="next" title="下一屏 (↓)"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </header>
    <div class="stage-body" id="stageBody">
      <div class="frame-wrap"><div class="frame-scale" id="frameScale"></div></div>
      <div class="notes" id="notes"></div>
    </div>
  </section>
</div>
<script>
/* ---------- 图标 ---------- */
const P = {
  shield:'<path d="M12 3l7 3v5c0 4.6-2.9 8.2-7 10-4.1-1.8-7-5.4-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/>',
  dash:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
  box:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M4 7.5l8 4.5 8-4.5"/><path d="M12 12v9"/>',
  send:'<path d="M4 12h12"/><path d="M13 7l5 5-5 5"/><path d="M20 4v16"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.6 7.6 0 000-2l2-1.5-2-3.4-2.4 1a8 8 0 00-1.7-1L14.9 3H9.1l-.4 3.1a8 8 0 00-1.7 1l-2.4-1-2 3.4L4.6 11a7.6 7.6 0 000 2l-2 1.5 2 3.4 2.4-1a8 8 0 001.7 1l.4 3.1h5.8l.4-3.1a8 8 0 001.7-1l2.4 1 2-3.4-2-1.5z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  eye:'<path d="M2.8 12S6.2 6.5 12 6.5 21.2 12 21.2 12 17.8 17.5 12 17.5 2.8 12 2.8 12z"/><circle cx="12" cy="12" r="2.6"/>',
  eyeOff:'<path d="M2.8 12S6.2 6.5 12 6.5 21.2 12 21.2 12 17.8 17.5 12 17.5 2.8 12 2.8 12z"/><circle cx="12" cy="12" r="2.6"/><path d="M4 4l16 16"/>',
  lock:'<rect x="5" y="10.5" width="14" height="9.5" rx="2.2"/><path d="M8.2 10.5V7.6a3.8 3.8 0 017.6 0v2.9"/>',
  unlock:'<rect x="5" y="10.5" width="14" height="9.5" rx="2.2"/><path d="M8.2 10.5V7.6a3.8 3.8 0 017.1-1.8"/>',
  alert:'<path d="M12 4.5l8.5 15h-17l8.5-15z"/><path d="M12 10v4"/><path d="M12 17h.01"/>',
  info:'<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><path d="M12 8h.01"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  card:'<rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M2.5 10h19"/><path d="M6.5 14.5h3"/>',
  min:'<path d="M5 12h14"/>', max:'<rect x="6" y="6" width="12" height="12" rx="1.5"/>', close:'<path d="M6 6l12 12M18 6L6 18"/>',
  folder:'<path d="M3 7.5A1.5 1.5 0 014.5 6h4l2 2.4h9A1.5 1.5 0 0121 10v7.5A1.5 1.5 0 0119.5 19h-15A1.5 1.5 0 013 17.5v-10z"/>',
  refresh:'<path d="M20 12a8 8 0 10-2.6 5.9"/><path d="M20 6.5V12h-5.5"/>',
  disk:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.6"/>',
  key:'<circle cx="8" cy="12" r="3.6"/><path d="M11.6 12H21"/><path d="M17.5 12v3.2"/><path d="M20.2 12v2.2"/>',
  eject:'<path d="M5 14.5h14"/><path d="M12 4.5l6 7H6l6-7z"/><path d="M6 18.5h12"/>',
  trash:'<path d="M4.5 7h15"/><path d="M9.5 7V5.2h5V7"/><path d="M6.5 7l.9 12.2h9.2L17.5 7"/>',
  chevron:'<path d="M9 6l6 6-6 6"/>',
  back:'<path d="M15 6l-6 6 6 6"/>',
  sort:'<path d="M8 10.5l4-4 4 4"/><path d="M8 13.5l4 4 4-4"/>',
  down:'<path d="M6 9l6 6 6-6"/>',
  file:'<path d="M13.5 3.5H7A1.5 1.5 0 005.5 5v14A1.5 1.5 0 007 20.5h10a1.5 1.5 0 001.5-1.5V8.5l-5-5z"/><path d="M13.5 3.5v5h5"/>',
  layers:'<path d="M12 3.5l8.5 4.6L12 12.7 3.5 8.1 12 3.5z"/><path d="M3.5 15.9L12 20.5l8.5-4.6"/><path d="M3.5 12L12 16.6 20.5 12"/>'
};
const ic = (n, cls) => '<svg viewBox="0 0 24 24"' + (cls ? ' class="' + cls + '"' : '') + '>' + P[n] + '</svg>';

/* ---------- 结构件 ---------- */
const gate = o => `
  <div class="gate">
    <div class="gate-mark ${o.markCls || ''}">${ic(o.mark || 'shield')}</div>
    <div class="gate-word">USB Vault</div>
    <div class="gate-rule"></div>
    <h2>${o.title}</h2>
    <p class="sub">${o.sub}</p>
    ${o.form ? `<div class="gate-form">${o.form}</div>` : ''}
    <div class="gate-foot"><span class="pulse ${o.footTone || ''}"></span><span>${o.foot}</span></div>
  </div>`;

const NAVS = [
  ['dash', 'dash', '仪表盘'], ['box', 'box', '容器'],
  ['send', 'send', '导出与迁移'], ['clock', 'clock', '操作日志'], ['gear', 'gear', '设置']
];
const app = o => `
  <nav class="side">
    <div class="side-lab">工作区</div>
    ${NAVS.slice(0, 2).map(n => `<div class="side-i ${o.nav === n[0] ? 'on' : ''}">${ic(n[1])}<span>${n[2]}</span>${n[0] === 'box' && o.count ? `<span class="tail">${o.count}</span>` : ''}</div>`).join('')}
    <div class="side-lab">数据</div>
    ${NAVS.slice(2, 4).map(n => `<div class="side-i ${o.nav === n[0] ? 'on' : ''}">${ic(n[1])}<span>${n[2]}</span></div>`).join('')}
    <div class="side-lab">系统</div>
    <div class="side-i ${o.nav === 'gear' ? 'on' : ''}">${ic('gear')}<span>设置</span></div>
    <div class="side-foot"><span class="dotc"></span><span class="t">安全卡已认证<small>${o.cardId || 'VK·7C2A'}</small></span></div>
  </nav>
  <main class="main">
    <div class="main-head">
      <div><h2>${o.title}</h2><p>${o.sub}</p></div>
      <div class="acts">${o.acts || ''}</div>
    </div>
    <div class="main-body">${o.body}</div>
  </main>`;

/* ---------- 屏幕 ---------- */
const S = [];
const add = s => S.push(s);
/* ===== 00 设计语言 ===== */
add({
  g: '设计基线', t: '设计语言', path: 'design-tokens', st: 'spec', w: 1180, h: 720,
  body: `<div class="dl" style="flex:1">
    <div class="grid2">
      <div>
        <h3>色板 · 石墨底与香槟金</h3>
        <div class="sw">
          <div><i style="background:#08090B"></i><span>#08090B 底</span></div>
          <div><i style="background:#0B0D10"></i><span>#0B0D10 面</span></div>
          <div><i style="background:#101216"></i><span>#101216 浮层</span></div>
          <div><i style="background:#C8A96A"></i><span>#C8A96A 金</span></div>
          <div><i style="background:#68BE95"></i><span>#68BE95 正常</span></div>
          <div><i style="background:#D8A544"></i><span>#D8A544 注意</span></div>
          <div><i style="background:#D96B62"></i><span>#D96B62 危险</span></div>
        </div>
        <h3 style="margin-top:26px">字阶</h3>
        <div class="tscale">
          <div><small>20 / 600</small><span style="font-size:20px;font-weight:600">页面标题 仪表盘</span></div>
          <div><small>13.5 / 600</small><span style="font-size:13.5px;font-weight:600">条目标题 工作资料</span></div>
          <div><small>12.5 / 400</small><span style="font-size:12.5px;color:var(--text-2)">正文与说明文字</span></div>
          <div><small>10.5 / 600 · 0.14em</small><span style="font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)">分组标签 CONTAINERS</span></div>
          <div><small>12 / mono</small><span style="font-family:var(--mono);font-size:12px;color:var(--text-2)">D:\\Vault\\work.vc · 64 GiB · X:</span></div>
        </div>
      </div>
      <div>
        <h3>控件</h3>
        <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px">
          <span class="btn pri">${ic('lock')}主操作</span>
          <span class="btn">次操作</span>
          <span class="btn danger">危险操作</span>
          <span class="btn ghost">文字按钮</span>
        </div>
        <div style="max-width:340px">
          <div class="field"><label>密码</label><div class="inp focus"><span class="val">••••••••••<span class="caret"></span></span><span class="eye">${ic('eye')}</span></div>
            <div class="meter lv3"><span class="segs"><i></i><i></i><i></i></span><span class="txt">较强</span></div></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin:18px 0">
          <span class="tag ok">${ic('check')}已挂载 X:</span><span class="tag gold">隐藏卷</span>
          <span class="tag">标准卷</span><span class="tag bad">无法打开</span>
          <span class="tog on"><i></i></span><span class="cbx on">${ic('check')}</span>
        </div>
        <h3 style="margin-top:22px">四条设计原则</h3>
        <div class="note gold"><span class="ni">${ic('info')}</span><span>
          <b>一、界面不得成为档位痕迹。</b>任何入口在任何密码下都恒显，不得灰化、不得出现"高级功能"占位。<br>
          <b>二、少即是可信。</b>一屏一件事，发丝线分隔代替色块堆叠，金色只用于当前焦点与主操作。<br>
          <b>三、状态先于装饰。</b>盘符、容量、卷类型用等宽字呈现，可扫读、可截图核对。<br>
          <b>四、危险动作要费力。</b>不可逆动作一律二次确认，且第二道需要键入确认词。</span></div>
      </div>
    </div>
  </div>`,
  bare: true,
  notes: [
    '基调从原型的<b>蓝紫仪表盘</b>改为<b>石墨底 + 香槟金</b>：加密产品的可信感来自克制，而不是渐变与阴影。',
    '金色仅出现在三处：品牌标记、当前焦点（输入框/选中项）、主操作按钮。其余一律中性灰阶。',
    '全部字体走系统栈（Segoe UI Variable / 微软雅黑），<b>不引入 Web 字体</b>：WebView2 离线环境不能依赖外链。',
    '所有图标为内联 SVG 线性图标，<b>取代原型中的 emoji</b>（emoji 在不同 Windows 版本渲染不一致，且显廉价）。'
  ],
  refs: ['WebView2 离线', 'ui/card_session.html', '8.4 UI 层']
});

/* ===== 01 全流程地图 ===== */
add({
  g: '设计基线', t: '全流程地图', path: 'flow-map', st: 'spec', w: 1180, h: 620,
  body: `<div class="dl" style="flex:1">
    <h3>四段主流程 · 26 屏</h3>
    <div class="flowmap">
      <div class="fm"><h5>一 · 会话入口</h5><ol>
        <li><em>02</em>连接安全组件</li><li><em>03</em>未插入安全卡</li><li><em>04</em>初始化安全卡</li>
        <li><em>05</em>打开安全会话</li><li><em>06</em>认证失败</li><li><em>07</em>组件不可用</li></ol></div>
      <div class="fm"><h5>二 · 主界面</h5><ol>
        <li><em>08</em>仪表盘 · 空</li><li><em>09</em>仪表盘 · 有容器</li><li><em>10</em>容器详情</li>
        <li><em>11</em>挂载中</li><li><em>12</em>无法打开的容器</li><li><em>13</em>拔卡即卸载</li></ol></div>

        <li><em>17</em>风险确认</li><li><em>18</em>创建执行</li><li><em>19</em>诱饵填充引导</li></ol></div>
      <div class="fm"><h5>四 · 维护与数据</h5><ol>
        <li><em>20</em>更新诱饵</li><li><em>21</em>完整性告警</li><li><em>22</em>明文导出</li>
        <li><em>23</em>密文迁移</li><li><em>24</em>操作日志</li><li><em>25</em>设置</li></ol></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px">
      <div class="note"><span class="ni">${ic('info')}</span><span><b>与旧原型的三处结构性差异：</b>① 删除"注册／忘记密码"（认证锚点在卡上，且忘记密码不实现）；② 侧栏不再按"加密盘／隐藏盘"分类，改为统一的<b>容器</b>视图；③ 应用内文件管理器于 2026-09-08 经用户决定提前回 v1（原议降级 v1.1），侧栏「文件管理」是真入口，只管容器内部。</span></div>
      <div class="note warn"><span class="ni">${ic('alert')}</span><span><b>贯穿全流程的红线：</b>界面在任何密码下都必须逐字一致 —— 入口恒显、文案固定、不作第二密码校验、不留导出痕迹。屏 14／16／22 是三处最容易做错的地方。</span></div>
    </div>
  </div>`,
  bare: true,
  notes: [
    '流程按"<b>先认证、再按可观察事实挂载</b>"组织：产品只知道卡记录是否有效、容器文件是否存在，不存在任何档位状态机。',
    '旧原型的用户名/注册/忘记密码三件套已删除 —— 认证锚点是卡上的双信封，不是账号体系。',
    '备份中心改名为<b>导出与迁移</b>：需求里的"备份"实为明文导出与密文迁移两条独立路径，语义不同、痕迹要求也不同。'
  ],
  refs: ['8.6 实现规则', 'N-06', 'Q-02 忘记密码不实现', 'Q-04']
});

/* ===== 会话入口 ===== */
const GW = 460, GH = 620;

add({
  g: '一 · 会话入口', t: '正在连接安全组件', path: 'state:initializing', st: 'done', w: GW, h: GH,
  body: gate({
    mark: 'shield', title: '正在连接安全组件', sub: '正在与本机安全服务建立通道，请稍候。',
    form: `<span class="btn block dis" style="justify-content:center"><span class="spin dark"></span>正在初始化</span>`,
    foot: '安全通道建立中', footTone: 'off'
  }),
  notes: [
    '首屏不出现任何输入框：状态未知时给出输入框，会让用户对着一个还不能受理的表单发呆。',
    '窗口尺寸 460×620，<b>与主界面窗口刻意不同</b>：会话未打开时不呈现工作区骨架，避免"看起来已经进去了"的误判。',
    '品牌标记 + 字距放大的字标 + 一道金色发丝线，是全流程唯一的品牌表达位置。'
  ],
  refs: ['P1.5', 'P2.15c 五态页', 'card_session.js: initializing']
});

add({
  g: '一 · 会话入口', t: '未插入安全卡', path: 'state:no-card', st: 'done', w: GW, h: GH,

/* ---------- 渲染 ---------- */
const ST = {
  done: ['已实现', 'done'], part: ['部分实现', 'part'],
  todo: ['未实现', 'todo'], spec: ['设计基线', 'change']
};
const navEl = document.getElementById('index-nav');
const frameScale = document.getElementById('frameScale');
const frameWrap = document.querySelector('.frame-wrap');
const stageBody = document.getElementById('stageBody');
const notesEl = document.getElementById('notes');
let cur = 0;

(() => {
  let last = '';
  navEl.innerHTML = S.map((s, i) => {
    const head = s.g !== last ? `<div class="grp-label">${s.g}</div>` : '';
    last = s.g;
    return head + `<button class="nav-s" data-i="${i}">
      <span class="num">${String(i).padStart(2, '0')}</span>
      <span class="label">${s.t}</span>
      <span class="dot dot-${s.st}"></span>
    </button>`;
  }).join('');
})();

const fit = () => {
  const s = S[cur];
  const avail = stageBody.clientWidth - 56;
  const k = Math.min(1, avail / s.w);
  frameScale.style.transform = `scale(${k})`;
  frameWrap.style.height = (s.h * k) + 'px';
};

const show = i => {
  cur = i;
  const s = S[i];
  document.getElementById('sTitle').textContent = s.t;
  document.getElementById('sPath').textContent = s.path;
  document.getElementById('sChip').innerHTML = `<span class="chip ${ST[s.st][1]}"><i></i>${ST[s.st][0]}</span>`;
  frameScale.innerHTML = `<div class="win" style="width:${s.w}px;height:${s.h}px">
    <div class="titlebar">
      <div class="tb-brand"><span class="glyph">${ic('shield')}</span><span>USB Vault</span></div>
      <div class="tb-ctl"><i>${ic('min')}</i><i>${ic('max')}</i><i>${ic('close')}</i></div>
    </div>
    <div class="win-body">${s.body}</div>
    ${s.overlay || ''}
  </div>`;
  notesEl.innerHTML = `
    <div class="note-card"><h3>设计说明</h3><ul>${s.notes.map(n => `<li>${n}</li>`).join('')}</ul></div>
    <div class="note-card"><h3>依据与状态</h3>
      <div style="margin-bottom:14px"><span class="chip ${ST[s.st][1]}"><i></i>${ST[s.st][0]}</span></div>
      <div class="refs">${s.refs.map(r => `<span class="ref">${r}</span>`).join('')}</div>
    </div>`;
  navEl.querySelectorAll('.nav-s').forEach(b => b.classList.toggle('on', +b.dataset.i === i));
  stageBody.scrollTop = 0;
  fit();
  location.hash = 'p' + i;
};

navEl.addEventListener('click', e => {
  const b = e.target.closest('.nav-s');
  if (b) show(+b.dataset.i);
});
document.getElementById('prev').onclick = () => show((cur - 1 + S.length) % S.length);
document.getElementById('next').onclick = () => show((cur + 1) % S.length);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight' || e.key === 'j') show((cur + 1) % S.length);
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'k') show((cur - 1 + S.length) % S.length);
});
window.addEventListener('resize', fit);
const start = parseInt((location.hash || '').replace('#p', ''), 10);
show(Number.isInteger(start) && start >= 0 && start < S.length ? start : 0);

</script>
